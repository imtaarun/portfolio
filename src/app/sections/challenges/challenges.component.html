<app-section
  sectionId="challenges"
  eyebrow="Challenges"
  heading="Two hard problems I solved."
  intro="One from my current role and one from SITA: what went wrong, why it was hard and what I did."
  extraClass="bg-card"
>
  <div class="flex flex-col gap-6">
    @for (c of challenges; track c.id; let i = $index) {
      <article appReveal class="card overflow-hidden !bg-page">
        <header class="border-b border-line p-6 sm:p-8">
          <p class="text-sm text-faint">Challenge {{ i + 1 }} · {{ c.org }}</p>
          <h3 class="mt-1.5 text-2xl font-semibold tracking-tight text-ink">{{ c.title }}</h3>
        </header>

        <div class="grid md:grid-cols-2">
          <div
            class="flex flex-col gap-5 border-b border-line p-6 sm:p-8 md:border-b-0 md:border-r"
          >
            <div>
              <p class="label text-ink">The problem</p>
              <p class="mt-2 leading-relaxed text-muted">{{ c.problem }}</p>
            </div>
            <div>
              <p class="label text-faint">Why it was hard</p>
              <p class="mt-2 leading-relaxed text-muted">{{ c.whyHard }}</p>
            </div>
          </div>
          <div class="flex flex-col gap-5 bg-card/70 p-6 sm:p-8">
            <div>
              <p class="label text-accent">How I solved it</p>
              <ol class="mt-3 flex flex-col gap-3">
                @for (s of c.solution; track $index) {
                  <li class="flex gap-3 leading-relaxed text-muted">
                    <span
                      class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-accent-soft font-mono text-xs text-accent"
                    >
                      {{ $index + 1 }}
                    </span>
                    {{ s }}
                  </li>
                }
              </ol>
            </div>
          </div>
        </div>

        <footer class="flex gap-3 border-t border-line bg-card px-6 py-5 sm:px-8">
          <lucide-icon
            [img]="CircleCheck"
            [size]="20"
            class="mt-0.5 shrink-0 text-ok"
            aria-hidden="true"
          />
          <p class="leading-relaxed text-ink">
            <span class="font-semibold">Result. </span>{{ c.result }}
          </p>
        </footer>
      </article>
    }
  </div>
</app-section>
