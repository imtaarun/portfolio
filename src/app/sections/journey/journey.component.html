<app-section
  sectionId="journey"
  eyebrow="My journey"
  heading="My path so far."
  intro="My experience and education, most recent first. Select any step to open its full details further down."
  extraClass="bg-card"
>
  <ol #list class="relative flex flex-col gap-8 md:gap-6">
    <!-- grey track, and the blue fill that grows as you scroll -->
    <span
      aria-hidden="true"
      class="absolute bottom-0 left-5 top-0 w-0.5 -translate-x-1/2 rounded bg-line md:left-1/2"
    ></span>
    <span
      aria-hidden="true"
      class="absolute bottom-0 left-5 top-0 w-0.5 origin-top -translate-x-1/2 rounded bg-accent transition-transform duration-150 ease-out md:left-1/2"
      [style.transform]="'scaleY(' + fill() + ')'"
    ></span>

    @for (m of milestones; track m.id; let i = $index) {
      <li class="relative grid grid-cols-[2.5rem_1fr] gap-4 md:grid-cols-[1fr_3rem_1fr] md:gap-6">
        <!-- dot -->
        <div class="relative z-10 col-start-1 row-start-1 flex justify-center pt-5 md:col-start-2">
          <span
            appReveal
            revealMargin="0px 0px -30% 0px"
            style="--reveal-y: 0px; --reveal-scale: 0.9"
            class="flex h-10 w-10 items-center justify-center rounded-full border-2 bg-card"
            [class]="m.kind === 'work' ? 'border-accent text-accent' : 'border-ink text-ink'"
          >
            <lucide-icon
              [img]="m.kind === 'work' ? icons.Briefcase : icons.GraduationCap"
              [size]="17"
              aria-hidden="true"
            />
          </span>
        </div>

        <!-- card: alternates sides on wide screens -->
        <div
          appReveal
          revealMargin="0px 0px -20% 0px"
          class="col-start-2 row-start-1 min-w-0"
          [class]="i % 2 === 0 ? 'md:col-start-1' : 'md:col-start-3'"
        >
          <div class="card card-hover p-5 sm:p-6">
            <p class="flex flex-wrap items-center gap-2 text-sm">
              <span class="font-mono text-accent">{{ m.period }}</span>
              <span
                class="rounded-full px-2 py-0.5 text-xs font-medium"
                [class]="
                  m.kind === 'work'
                    ? 'bg-accent-soft text-accent'
                    : 'bg-page text-ink ring-1 ring-line'
                "
              >
                {{ m.kind === 'work' ? 'Experience' : 'Education' }}
              </span>
            </p>
            <h3 class="mt-2 text-xl font-semibold tracking-tight text-ink">{{ m.org }}</h3>
            <p class="mt-0.5 font-medium text-ink/80">{{ m.title }}</p>
            <p class="mt-1 text-sm text-faint">{{ m.location }}</p>
            <p class="mt-3 leading-relaxed text-muted">{{ m.summary }}</p>
            <a
              [href]="'#' + m.detailId"
              (click)="openDetail($event, m.detailId)"
              class="group mt-4 inline-flex items-center gap-1.5 rounded text-sm font-medium text-accent underline-offset-4 hover:underline"
            >
              View details
              <lucide-icon
                [img]="icons.ArrowDown"
                [size]="14"
                aria-hidden="true"
                class="transition-transform duration-200 group-hover:translate-y-0.5"
              />
            </a>
          </div>
        </div>
      </li>
    }
  </ol>
</app-section>
