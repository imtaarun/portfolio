<header
  class="fixed inset-x-0 top-0 z-50 border-b transition-colors duration-300"
  [class]="
    scrolled() || open()
      ? 'border-line bg-page/90 backdrop-blur-md'
      : 'border-transparent bg-transparent'
  "
  style="padding-top: env(safe-area-inset-top, 0px)"
>
  <nav
    aria-label="Primary"
    class="mx-auto flex h-16 max-w-5xl items-center justify-between gap-4 px-5 sm:px-8"
  >
    <a
      href="#top"
      (click)="go($event, 'top')"
      class="text-[15px] font-semibold tracking-tight text-ink"
    >
      {{ profile.fullName }}
    </a>

    <ul class="hidden items-center gap-1 lg:flex">
      @for (item of navItems; track item.id) {
        <li>
          <a
            [href]="'#' + item.id"
            (click)="go($event, item.id)"
            [attr.aria-current]="active() === item.id ? 'true' : null"
            class="rounded-full px-3 py-1.5 text-sm transition-colors"
            [class]="
              active() === item.id ? 'bg-accent-soft text-accent' : 'text-muted hover:text-ink'
            "
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-2">
      <a
        [href]="resume.file"
        [attr.download]="resume.downloadName"
        class="hidden items-center gap-1.5 rounded-full bg-ink px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-accent sm:inline-flex"
      >
        <lucide-icon [img]="icons.Download" [size]="14" aria-hidden="true" /> Resume
      </a>
      <button
        #menuButton
        type="button"
        (click)="open.set(!open())"
        [attr.aria-expanded]="open()"
        aria-controls="mobile-menu"
        [attr.aria-label]="open() ? 'Close menu' : 'Open menu'"
        class="press inline-flex h-11 w-11 items-center justify-center rounded-full border border-line bg-card text-ink lg:hidden"
      >
        <lucide-icon [img]="open() ? icons.X : icons.Menu" [size]="18" aria-hidden="true" />
      </button>
    </div>
  </nav>

  <!-- reading progress -->
  <div
    aria-hidden="true"
    class="absolute inset-x-0 bottom-[-1px] h-[2px] origin-left bg-accent"
    [style.transform]="'scaleX(' + scroll.progress() + ')'"
  ></div>

  @if (open()) {
    <div
      id="mobile-menu"
      animate.enter="menu-enter"
      animate.leave="menu-leave"
      class="border-t border-line bg-page lg:hidden"
    >
      <ul class="mx-auto flex max-w-5xl flex-col px-5 py-3 sm:px-8">
        @for (item of navItems; track item.id) {
          <li>
            <a
              [href]="'#' + item.id"
              (click)="go($event, item.id)"
              class="block rounded-lg px-3 py-3 text-base"
              [class]="active() === item.id ? 'bg-accent-soft font-medium text-accent' : 'text-ink'"
            >
              {{ item.label }}
            </a>
          </li>
        }
        <li class="px-3 pb-2 pt-3">
          <a
            [href]="resume.file"
            [attr.download]="resume.downloadName"
            class="inline-flex items-center gap-2 rounded-full bg-ink px-4 py-2.5 text-sm font-medium text-white"
          >
            <lucide-icon [img]="icons.Download" [size]="14" aria-hidden="true" /> Download resume
          </a>
        </li>
      </ul>
    </div>
  }
</header>
